[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avisengine"
version = "0.2.0"
description = "Python API for AVIS Engine: the desktop simulator and the AVIS Academy web Sandbox"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amirmohammad Zarif", email = "amirmohammadzarif@avisengine.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.21",
  "opencv-python>=4.5",
  "Pillow>=9",
  "websockets>=13",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
avisengine = "avisengine.__main__:main"

[project.urls]
Homepage = "https://avisengine.com"
Sandbox = "https://academy.avisengine.com"
Source = "https://github.com/AvisEngine/AVIS-Engine-Python-API"

[tool.setuptools]
packages = ["avisengine"]
